<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07140e">
  <title>DYCHESS — Browser Hub</title>
  <style>
    :root {
      --bg: #07140e;
      --panel: #10251a;
      --green: #7fae3d;
      --gold: #d9b45b;
      --text: #f5f5ed;
      --muted: #b4c0b5;
      --border: #294332;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }

    header {
      border-bottom: 1px solid var(--border);
      background: #091a11;
    }

    .nav {
      max-width: 1120px;
      margin: auto;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span { color: var(--gold); }

    nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 14px;
      color: var(--muted);
    }

    nav a:hover { color: var(--gold); }

    main {
      max-width: 1120px;
      margin: auto;
      padding: 48px 22px;
    }

    .hero {
      padding: 44px 0 34px;
    }

    .eyebrow {
      color: var(--gold);
      font-weight: bold;
      letter-spacing: 3px;
      font-size: 12px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 64px);
      line-height: 1.08;
      margin: 14px 0;
    }

    .hero p {
      max-width: 620px;
      color: var(--muted);
      font-size: 17px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .button {
      display: inline-block;
     padding: 7px 10px;
      border-radius: 8px;
      background: var(--green);
      color: #10190b;
      font-weight: bold;
      border: 1px solid var(--green);
    }

    .button.secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }

    h2 { font-size: 25px; margin-bottom: 8px; }

    .section-intro { color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin: 22px 0 42px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
    }

    .card h3 { margin-top: 0; color: var(--gold); }

    .card p { color: var(--muted); font-size: 14px; }

    .tournament-area {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(135deg, #10251a, #0a1910);
      margin-bottom:40px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .nav { align-items: flex-start; flex-direction: column; }
      main { padding-top: 22px; }
      .hero { padding-top: 30px; }
    }

 /* Match the original DYCHESS tournament card layout */
#tournaments .tournament-area {
  width: 100%;
  max-width: 750px;
  min-width: 0;
  margin: 16px 0 24px;
  padding: 0;
  box-sizing: border-box;
  background: transparent;
  border: none;
  border-radius: 0;
  box-shadow: none;
  color: #ffffff;
}

#tournaments #tournamentList {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  width: 100%;
}

#tournaments #tournamentList > div {
  width: 100%;
  box-sizing: border-box;
  min-width: 0;
  background: linear-gradient(145deg, #102319, #080d0a);
  color: #ffffff;
  border: 1px solid #c9a64b;
  border-radius: 16px;
  padding: 26px;
  box-shadow: 0 10px 28px rgba(8, 13, 10, 0.16);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

#tournaments #tournamentList > div:hover {
  transform: translateY(-4px);
  box-shadow: 0 16px 34px rgba(8, 13, 10, 0.24);
}

#tournaments #tournamentList h3,
#tournaments #tournamentList h4 {
  color: #c9a64b;
  font-size: 23px;
  margin: 16px 0;
}

#tournaments #tournamentList p {
  color: #e1e8de;
  line-height: 1.9;
}

@media (max-width: 900px) {
  #tournaments #tournamentList {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  #tournaments .tournament-area,
  #tournaments #tournamentList > div {
    padding: 20px;
  }

  #tournaments #tournamentList {
    grid-template-columns: 1fr;
  }
}
  #tournaments .tournament-area h3 {
  margin: 8px 0;
}

#tournaments .tournament-area > p {
  margin: 6px 0 10px;
}
    padding-top: 8px;
  padding-bottom: 8px;
}

#tournaments .tournament-area > h3 {

#tournaments .tournament-area > p {

#tournaments .tournament-area #tournamentList {

@media (max-width: 650px) {

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  window.dychessDB = window.supabase.createClient(
    'https://rpfowuqlhboslhmvjelc.supabase.co',
    'sb_publishable_K5Fzinv7_Ac0gpaQc2C6Lg_3KstrDKY'
  );
  
  console.log('DYCHESS Supabase client initialized.');

async function loadTournaments() {
  const list = document.getElementById('tournamentList');
  if (!list) return;

  try {
    const { data, error } = await window.dychessDB
      .from('tournaments')
      .select('id, name, lichess_url, tournament_date, tournament_time')
      .order('tournament_date', { ascending: true });

    if (error) throw error;

    if (!data || data.length === 0) {
      list.textContent = 'No upcoming tournaments yet. Check back soon!';
      return;
    }

    list.replaceChildren();

    data.forEach((tournament) => {
      const card = document.createElement('div');
      const title = document.createElement('h4');
      title.textContent = tournament.name;

      const details = document.createElement('p');
   
const dateText = tournament.tournament_date
  ? new Date(tournament.tournament_date + 'T12:00:00')
      .toLocaleDateString('en-GB', {
        weekday: 'long',
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      })
  : 'Date to be announced';

const timeText = tournament.tournament_time
  ? tournament.tournament_time.slice(0, 5) + ' UTC+1'
  : 'Time to be announced';

details.textContent =
  '📅 ' + dateText + '\n' +
  '🕗 ' + timeText + '\n' +
 '♟ 5+0\n' +
  'Blitz';

details.style.whiteSpace = 'pre-line';
      card.append(title, details);

      if (tournament.lichess_url) {
        const link = document.createElement('a');
        link.href = tournament.lichess_url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'Join Tournament';
        link.className = 'button';
        card.append(link);
      }

      list.append(card);
    });
  } catch (error) {
    console.error('Could not load tournaments:', error);
    list.textContent = 'Tournaments could not load. Please try again later.';
  }
}

loadTournaments();
</script>
