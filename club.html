
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club | DYCHESS</title>

  <style>
    :root {
      --bg: #07140e;
      --panel: #10251a;
      --gold: #d9b45b;
      --green: #7fae3d;
      --text: #f2f4ed;
      --muted: #aab7aa;
      --border: rgba(217,180,91,.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 50px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 950px;
      margin: auto;
    }

    a { color: var(--gold); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 25px;
    }

    .brand {
      color: var(--gold);
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 20px;
    }

    .back {
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 8px;
    }

    .hero, .section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .hero { text-align: center; }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--gold);
      margin-bottom: 12px;
    }

    h1 {
      color: var(--gold);
      margin: 8px 0;
      font-size: 30px;
    }

    h2 {
      color: var(--gold);
      font-size: 19px;
      margin-top: 0;
    }

    .muted { color: var(--muted); line-height: 1.6; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 22px;
    }

    .stat {
      background: rgba(0,0,0,.2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px 8px;
    }

    .stat strong {
      display: block;
      color: var(--gold);
      font-size: 24px;
      margin-bottom: 5px;
    }

    .join-area {
      margin-top: 22px;
      padding: 18px;
      background: rgba(0,0,0,.2);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .join-button {
      display: inline-block;
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      background: var(--gold);
      color: #07140e;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
    }

    .join-button:hover { background: #edca76; }

    .join-button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .secondary-button {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
    }

    .secondary-button:hover {
      background: rgba(217,180,91,.1);
    }

    #joinMessage {
      margin: 12px 0 0;
      font-size: 14px;
      line-height: 1.5;
      color: var(--muted);
    }

    .item {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .item:last-child { border-bottom: 0; }

    .item strong {
      display: block;
      margin-bottom: 5px;
    }

    .team-status {
      margin-top: 10px;
      padding: 12px;
      background: rgba(0,0,0,.2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .empty {
      color: var(--muted);
      padding: 12px 0;
    }

    .error {
      text-align: center;
      color: #ffb0a8;
      padding: 35px 15px;
    }

    .loading {
      text-align: center;
      color: var(--gold);
      padding: 45px 10px;
    }

    .leaderboard-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .leaderboard {
      width: 100%;
      min-width: 590px;
      border-collapse: collapse;
      text-align: center;
    }

    .leaderboard th,
    .leaderboard td {
      padding: 13px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      font-size: 13px;
    }

    .leaderboard th {
      color: var(--gold);
      background: rgba(0,0,0,.25);
      font-weight: 700;
    }

    .leaderboard tbody tr:last-child td {
      border-bottom: 0;
    }

    .leaderboard td.team-name {
      text-align: left;
      font-weight: 700;
    }

    .leaderboard td.points {
      color: var(--gold);
      font-weight: 800;
      font-size: 15px;
    }

    .leaderboard .rank {
      color: var(--gold);
      font-weight: 800;
    }

    @media (max-width: 550px) {
      .stats { grid-template-columns: 1fr; }
      .hero, .section { padding: 18px; }
      h1 { font-size: 25px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="top">
      <div class="brand">DYCHESS</div>
      <a class="back" href="clubs.html">← All Clubs</a>
    </div>

    <div id="content" class="loading">Loading club...</div>
  </main>

  <script>
    const SUPABASE_URL = "https://rpfowuqlhboslhmvjelc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_K5Fzinv7_Ac0gpaQc2C6Lg_3KstrDKY";

    const headers = {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    };

    const content = document.getElementById("content");

    let currentClub = null;
    let currentTeamStatus = null;
    let currentTeams = [];

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    async function getRows(table, query) {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/${table}?${query}`,
        { headers }
      );

      if (!response.ok) {
        throw new Error(`Could not load ${table}.`);
      }

      return response.json();
    }

    function loginToJoin() {
      const slug = new URLSearchParams(window.location.search).get("slug");
      const nextPage = `club.html?slug=${encodeURIComponent(slug || "")}`;

      window.location.href =
        "player-login.html?next=" + encodeURIComponent(nextPage);
    }

    async function callClubTeams(action, extra = {}) {
      const session = localStorage.getItem("dychess_player_session");

      if (!session) {
        loginToJoin();
        throw new Error("Please sign in to continue.");
      }

      const response = await fetch(
        `${SUPABASE_URL}/functions/v1/club-teams`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "x-dychess-session": session
          },
          body: JSON.stringify({
            action,
            ...extra
          })
        }
      );

      let data = {};

      try {
        data = await response.json();
      } catch (_) {
        data = {};
      }

      if (!response.ok) {
        throw new Error(
          data.error || data.message || "The team request could not be completed."
        );
      }

      return data;
    }

    async function requestToJoin() {
      const button = document.getElementById("joinButton");
      const message = document.getElementById("joinMessage");

      if (!currentClub || !button || !message) return;

      const session = localStorage.getItem("dychess_player_session");

      if (!session) {
        loginToJoin();
        return;
      }

      button.disabled = true;
      button.textContent = "Submitting...";
      message.textContent = "Submitting your membership request...";

      try {
        const response = await fetch(
          `${SUPABASE_URL}/functions/v1/club-management`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY,
              "x-dychess-session": session
            },
            body: JSON.stringify({
              action: "request_join",
              club_id: currentClub.id
            })
          }
        );

        let data = {};

        try {
          data = await response.json();
        } catch (_) {
          data = {};
        }

        if (response.status === 401 || response.status === 403) {
          message.textContent =
            "Your sign-in session may have expired. Please sign in again.";

          button.disabled = false;
          button.textContent = "Sign In Again";
          button.onclick = loginToJoin;
          return;
        }

        if (!response.ok) {
          throw new Error(
            data.error || data.message || "Your request could not be submitted."
          );
        }

        const outcome = data.status || data.result || "";

        if (outcome === "already_member") {
          message.textContent = "You are already an approved member of this club.";
          button.textContent = "Already a Member";
          button.disabled = true;
          return;
        }

        if (outcome === "already_pending") {
          message.textContent =
            "Your membership request is already awaiting organizer approval.";
          button.textContent = "Request Pending";
          button.disabled = true;
          return;
        }

        if (outcome === "requested" || outcome === "pending") {
          message.textContent =
            "Your request has been submitted. The club organizer must approve it before you become a member.";
          button.textContent = "Request Submitted";
          button.disabled = true;
          return;
        }

        message.textContent =
          data.message ||
          "Your request has been submitted. Await approval from the club organizer.";

        button.textContent = "Request Submitted";
        button.disabled = true;

      } catch (error) {
        console.error(error);
        message.textContent =
          error.message || "Something went wrong. Please try again.";

        button.disabled = false;
        button.textContent = "Request to Join";
      }
    }

    async function loadMyTeamStatus(clubId) {
      currentTeamStatus = null;

      const session = localStorage.getItem("dychess_player_session");

      if (!session) return;

      try {
        currentTeamStatus = await callClubTeams("my_status", {
          clubId
        });
      } catch (error) {
        console.error("Could not load player team status:", error);
        currentTeamStatus = {
          success: false,
          error: error.message
        };
      }
    }

    async function requestToJoinTeam(teamId, button) {
      if (!currentClub || !button) return;

      button.disabled = true;
      button.textContent = "Submitting...";

      try {
        const data = await callClubTeams("request_join", {
          teamId
        });

        if (data.success === false) {
          throw new Error(data.error || data.message || "Request failed.");
        }

        await loadTeams(currentClub.id);

      } catch (error) {
        console.error(error);

        alert(error.message || "Could not submit your team request.");

        button.disabled = false;
        button.textContent = "Request to Join Team";
      }
    }

    async function leaveTeam(membershipId, button) {
      if (!confirm("Are you sure you want to leave this team?")) {
        return;
      }

      button.disabled = true;
      button.textContent = "Leaving...";

      try {
        const data = await callClubTeams("leave_team", {
          membershipId
        });

        if (data.success === false) {
          throw new Error(data.error || data.message || "Could not leave team.");
        }

        await loadTeams(currentClub.id);

      } catch (error) {
        console.error(error);

        alert(error.message || "Could not leave the team.");

        button.disabled = false;
        button.textContent = "Leave Team";
      }
    }

    async function loadClub() {
      const slug = new URLSearchParams(window.location.search).get("slug");

      if (!slug) {
        content.innerHTML = `
          <div class="error">
            <h2>No club was specified.</h2>
            <p>Please return to the Clubs directory and select a club.</p>
            <a href="clubs.html">Go to Clubs</a>
          </div>`;
        return;
      }

      try {
        const clubs = await getRows(
          "clubs",
          `select=id,name,slug,description,logo_url,country,city,status&slug=eq.${encodeURIComponent(slug)}&status=eq.active&limit=1`
        );

        if (!clubs.length) {
          content.innerHTML = `
            <div class="error">
              <h2>Club not found</h2>
              <p>This club may not exist or may not currently be active.</p>
              <a href="clubs.html">Return to Clubs</a>
            </div>`;
          return;
        }

        const club = clubs[0];
        currentClub = club;

        content.innerHTML = `
          <section class="hero">
            ${club.logo_url
              ? `<img class="logo" src="${escapeHTML(club.logo_url)}" alt="Club logo">`
              : ""}
            <h1>${escapeHTML(club.name)}</h1>
            <p class="muted">
              ${[club.city, club.country].filter(Boolean).map(escapeHTML).join(", ") || "Chess Club"}
            </p>
            <p class="muted">${escapeHTML(club.description || "Welcome to this chess club.")}</p>

            <div class="join-area">
              <button
                type="button"
                class="join-button"
                id="joinButton"
                onclick="requestToJoin()">
                Request to Join
              </button>
              <p id="joinMessage">
                Sign in with Lichess to request membership. The club organizer must approve your request.
              </p>
            </div>

            <div class="stats">
              <div class="stat">
                <strong id="memberCount">—</strong>
                Members
              </div>
              <div class="stat">
                <strong id="teamCount">—</strong>
                Teams
              </div>
              <div class="stat">
                <strong id="tournamentCount">—</strong>
                Tournaments
              </div>
            </div>
          </section>

          <section class="section">
            <h2>Club Members</h2>
            <div id="members"><p class="empty">Loading members...</p></div>
          </section>

          <section class="section">
            <h2>Club Teams</h2>
            <p class="muted">
              Approved club members can request to join a team. You can belong to one team at a time.
            </p>
            <div id="teams"><p class="empty">Loading teams...</p></div>
          </section>

          <section class="section">
            <h2>Team Leaderboard</h2>
            <p class="muted">
              Team standings are calculated from recorded match results. Teams earn 3 points for a win, 1 for a draw and 0 for a loss.
            </p>
            <div id="teamLeaderboard">
              <p class="empty">Loading team standings...</p>
            </div>
          </section>

          <section class="section">
  <h2>Player Statistics</h2>
  <p class="muted">
   
  </p>
  <div id="playerStatistics">
    <p class="empty">Loading player statistics...</p>
  </div>
</section>


          <section class="section">
            <h2>Club Tournaments</h2>
            <div id="tournaments"><p class="empty">Loading tournaments...</p></div>
          </section>
        `;

      await Promise.all([
  loadMembers(club.id),
  loadTeams(club.id),
  loadTeamLeaderboard(club.id),
  loadPlayerStatistics(club.id),
  loadTournaments(club.id)
]);

      } catch (error) {
        console.error(error);
        content.innerHTML = `
          <div class="error">
            <h2>Unable to load this club</h2>
            <p>${escapeHTML(error.message)}</p>
            <a href="clubs.html">Return to Clubs</a>
          </div>`;
      }
    }

    async function loadMembers(clubId) {
      const target = document.getElementById("members");

      try {
        const memberships = await getRows(
          "club_members",
          `select=player_id,joined_at&club_id=eq.${clubId}&status=eq.approved&order=joined_at.asc`
        );

        document.getElementById("memberCount").textContent = memberships.length;

        if (!memberships.length) {
          target.innerHTML = '<p class="empty">No approved members yet. You can be the first to request membership.</p>';
          return;
        }

        const ids = [...new Set(memberships.map(m => m.player_id))];

        const players = await getRows(
          "players",
          `select=id,display_name,lichess_username&id=in.(${ids.join(",")})`
        );

        const playerMap = new Map(players.map(p => [String(p.id), p]));

        target.innerHTML = memberships.map(member => {
          const player = playerMap.get(String(member.player_id));
          const name = player
            ? (player.display_name || player.lichess_username)
            : `Player ${member.player_id}`;

          return `
            <div class="item">
              <strong>${escapeHTML(name)}</strong>
              <span class="muted">Club member</span>
            </div>`;
        }).join("");

      } catch (error) {
        console.error(error);
        document.getElementById("memberCount").textContent = "—";
        target.innerHTML = '<p class="empty">Member information is currently unavailable.</p>';
      }
    }

    async function loadTeams(clubId) {
      const target = document.getElementById("teams");

      try {
        const teams = await getRows(
          "club_teams",
          `select=id,name,description,status&club_id=eq.${clubId}&status=eq.active&order=created_at.desc`
        );

        currentTeams = teams;

        document.getElementById("teamCount").textContent = teams.length;

        await loadMyTeamStatus(clubId);

        if (!teams.length) {
          target.innerHTML = '<p class="empty">This club has not created any teams yet.</p>';
          return;
        }

        const loggedIn = !!localStorage.getItem("dychess_player_session");

        const status = currentTeamStatus;
        const clubApproved =
          status && status.success && status.clubMembershipStatus === "approved";

        const memberships =
          status && status.success && Array.isArray(status.memberships)
            ? status.memberships
            : [];

        const activeMembership = memberships.find(m => m.status === "active");
        const pendingMembership = memberships.find(m => m.status === "pending");

        target.innerHTML = teams.map(team => {
          const membership = memberships.find(
            m => String(m.team_id) === String(team.id)
          );

          let controls = "";

          if (!loggedIn) {
            controls = `
              <p class="team-status">
                Sign in with Lichess and become an approved club member to request this team.
              </p>
              <button class="join-button" onclick="loginToJoin()">
                Sign In to Join
              </button>`;
          } else if (!status || !status.success) {
            controls = `
              <p class="team-status">
                Your team status could not be checked. Please refresh the page or sign in again.
              </p>`;
          } else if (!clubApproved) {
            controls = `
              <p class="team-status">
                You must first become an approved member of this club before joining a team.
              </p>`;
          } else if (membership && membership.status === "active") {
            controls = `
              <p class="team-status">
                You are an active member of this team.
              </p>
              <button
                class="join-button secondary-button"
                onclick="leaveTeam('${escapeHTML(membership.id)}', this)">
                Leave Team
              </button>`;
          } else if (membership && membership.status === "pending") {
            controls = `
              <p class="team-status">
                Your request to join this team is awaiting approval from the organizer or team captain.
              </p>`;
          } else if (activeMembership) {
            const activeTeam = activeMembership.team;
            controls = `
              <p class="team-status">
                You currently belong to ${escapeHTML(activeTeam?.name || "another team")}.
                Leave that team before requesting to join another one.
              </p>`;
          } else if (pendingMembership) {
            const pendingTeam = pendingMembership.team;
            controls = `
              <p class="team-status">
                You already have a pending request for ${escapeHTML(pendingTeam?.name || "another team")}.
                Wait for a decision before requesting another team.
              </p>`;
          } else {
            controls = `
              <button
                class="join-button"
                onclick="requestToJoinTeam('${escapeHTML(team.id)}', this)">
                Request to Join Team
              </button>`;
          }

          return `
            <div class="item">
              <strong>
                <a href="team.html?id=${encodeURIComponent(team.id)}">
                  ${escapeHTML(team.name)}
                </a>
              </strong>
              <span class="muted">${escapeHTML(team.description || "Club team")}</span>
              ${controls}
            </div>`;
        }).join("");

      } catch (error) {
        console.error(error);
        document.getElementById("teamCount").textContent = "—";
        target.innerHTML = '<p class="empty">Team information is currently unavailable.</p>';
      }
    }

    async function loadTeamLeaderboard(clubId) {
      const target = document.getElementById("teamLeaderboard");

      try {
        const [teams, matches] = await Promise.all([
          getRows(
            "club_teams",
            `select=id,name&club_id=eq.${encodeURIComponent(clubId)}&status=eq.active`
          ),
          getRows(
            "club_team_matches",
          `select=team_id,opponent_team_id,points,result&club_id=eq.${encodeURIComponent(clubId)}`
          )
        ]);

        if (!teams.length) {
          target.innerHTML =
            '<p class="empty">There are no active teams to rank yet.</p>';
          return;
        }

        const standings = new Map();

        teams.forEach(team => {
          standings.set(String(team.id), {
            id: team.id,
            name: team.name,
            played: 0,
            wins: 0,
            draws: 0,
            losses: 0,
            points: 0
          });
        });

       matches.forEach(match => {
  if (
    !match.opponent_team_id ||
    String(match.team_id) === String(match.opponent_team_id)
  ) {
    return;
  }

  const team = standings.get(String(match.team_id));
          if (!team) return;

          team.played += 1;
          team.points += Number(match.points) || 0;

          if (match.result === "win") {
            team.wins += 1;
          } else if (match.result === "draw") {
            team.draws += 1;
          } else if (match.result === "loss") {
            team.losses += 1;
          }
        });

        const rankedTeams = Array.from(standings.values()).sort((a, b) => {
          if (b.points !== a.points) return b.points - a.points;
          if (b.wins !== a.wins) return b.wins - a.wins;
          return a.name.localeCompare(b.name);
        });

        target.innerHTML = `
          <div class="leaderboard-wrap">
            <table class="leaderboard">
              <thead>
                <tr>
                  <th>Rank</th>
                  <th style="text-align:left;">Team</th>
                  <th>Played</th>
                  <th>Wins</th>
                  <th>Draws</th>
                  <th>Losses</th>
                  <th>Points</th>
                </tr>
              </thead>
              <tbody>
                ${rankedTeams.map((team, index) => `
                  <tr>
                    <td class="rank">${index + 1}</td>
                    <td class="team-name">
                      <a href="team.html?id=${encodeURIComponent(team.id)}">
                        ${escapeHTML(team.name)}
                      </a>
                    </td>
                    <td>${team.played}</td>
                    <td>${team.wins}</td>
                    <td>${team.draws}</td>
                    <td>${team.losses}</td>
                    <td class="points">${team.points}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
          <p class="muted">
            Rankings are ordered by total points, then number of wins.
          </p>
        `;

      } catch (error) {
        console.error("Could not load team leaderboard:", error);
        target.innerHTML =
          '<p class="empty">Team standings are currently unavailable. Please refresh the page and try again.</p>';
      }
    }

    
async function loadPlayerStatistics(clubId) {
  const target = document.getElementById("playerStatistics");

  try {
    const [teams, memberships, matches] = await Promise.all([
      getRows(
        "club_teams",
        `select=id,name&club_id=eq.${encodeURIComponent(clubId)}`
      ),
      getRows(
        "club_team_memberships",
        `select=team_id,player_id&club_id=eq.${encodeURIComponent(clubId)}&status=eq.active`
      ),
      getRows(
        "club_team_matches",
        `select=team_id,opponent_team_id,player_id,points,result&club_id=eq.${encodeURIComponent(clubId)}`
      )
    ]);

    const teamMap = new Map(
      teams.map(team => [String(team.id), team.name])
    );

    const statistics = new Map();

    // Include active team members, even if they have not played.
    memberships.forEach(member => {
      const key = String(member.player_id);

      if (!statistics.has(key)) {
        statistics.set(key, {
          playerId: member.player_id,
          teamId: member.team_id,
          played: 0,
          wins: 0,
          draws: 0,
          losses: 0,
          points: 0
        });
      }
    });

    // Add recorded results, excluding same-team matches.
    matches.forEach(match => {
      if (
        !match.opponent_team_id ||
        String(match.team_id) === String(match.opponent_team_id)
      ) {
        return;
      }

      const key = String(match.player_id);

      if (!statistics.has(key)) {
        statistics.set(key, {
          playerId: match.player_id,
          teamId: match.team_id,
          played: 0,
          wins: 0,
          draws: 0,
          losses: 0,
          points: 0
        });
      }

      const player = statistics.get(key);

      player.played += 1;
      player.points += Number(match.points) || 0;

      if (match.result === "win") {
        player.wins += 1;
      } else if (match.result === "draw") {
        player.draws += 1;
      } else if (match.result === "loss") {
        player.losses += 1;
      }
    });

    if (!statistics.size) {
      target.innerHTML =
        '<p class="empty">No team players or recorded player statistics yet.</p>';
      return;
    }

    const playerIds = [
      ...new Set(
        Array.from(statistics.values()).map(player => player.playerId)
      )
    ];

    const players = await getRows(
      "players",
      `select=id,display_name,lichess_username&id=in.(${playerIds.join(",")})`
    );

    const playerMap = new Map(
      players.map(player => [String(player.id), player])
    );

    const rankedPlayers = Array.from(statistics.values()).map(player => {
      const profile = playerMap.get(String(player.playerId));

      return {
        ...player,
        name: profile
          ? (profile.display_name || profile.lichess_username)
          : `Player ${player.playerId}`,
        teamName: teamMap.get(String(player.teamId)) || "Former team"
      };
    }).sort((a, b) => {
      if (b.points !== a.points) return b.points - a.points;
      if (b.wins !== a.wins) return b.wins - a.wins;
      return a.name.localeCompare(b.name);
    });

    target.innerHTML = `
      <div class="leaderboard-wrap">
        <table class="leaderboard">
          <thead>
            <tr>
              <th>Rank</th>
              <th style="text-align:left;">Player</th>
              <th style="text-align:left;">Team</th>
              <th>Played</th>
              <th>Wins</th>
              <th>Draws</th>
              <th>Losses</th>
              <th>Points</th>
            </tr>
          </thead>
          <tbody>
            ${rankedPlayers.map((player, index) => `
              <tr>
                <td class="rank">${index + 1}</td>
                <td class="team-name">${escapeHTML(player.name)}</td>
                <td>${escapeHTML(player.teamName)}</td>
                <td>${player.played}</td>
                <td>${player.wins}</td>
                <td>${player.draws}</td>
                <td>${player.losses}</td>
                <td class="points">${player.points}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
      <p class="muted">
        Players are ranked by total points, then wins. Only matches between different teams count.
      </p>
    `;

  } catch (error) {
    console.error("Could not load player statistics:", error);
    target.innerHTML =
      '<p class="empty">Player statistics are currently unavailable. Please refresh the page and try again.</p>';
  }
}


    async function loadTournaments(clubId) {
      const target = document.getElementById("tournaments");

      try {
        const tournaments = await getRows(
          "tournaments",
          `select=id,name,tournament_date,time_control&club_id=eq.${clubId}&order=tournament_date.desc`
        );

        document.getElementById("tournamentCount").textContent = tournaments.length;

        target.innerHTML = tournaments.length
          ? tournaments.map(tournament => `
              <div class="item">
                <strong>${escapeHTML(tournament.name || "Club Tournament")}</strong>
                <span class="muted">
                  ${tournament.tournament_date
                    ? escapeHTML(new Date(tournament.tournament_date).toLocaleDateString())
                    : "Date not announced"}
                  ${tournament.time_control
                    ? " · " + escapeHTML(tournament.time_control)
                    : ""}
                </span>
              </div>`).join("")
          : '<p class="empty">No club tournaments have been listed yet.</p>';

      } catch (error) {
        console.error(error);
        document.getElementById("tournamentCount").textContent = "—";
        target.innerHTML = '<p class="empty">Tournament information is currently unavailable.</p>';
      }
    }

    loadClub();
  </script>
