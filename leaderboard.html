<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DYCHESS Leaderboard</title>

  <style>
    :root {
      --green: #7fae3d;
      --dark: #080d0a;
      --panel: #102319;
      --gold: #c9a64b;
      --text: #f5f5f0;
      --muted: #c5cec3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--dark);
      color: var(--text);
    }

    header {
      padding: 22px 16px;
      border-bottom: 1px solid var(--gold);
      background: var(--panel);
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
    }

    header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      color: var(--gold);
      font-size: 22px;
      font-weight: bold;
      text-decoration: none;
    }

    .button {
      display: inline-block;
      padding: 9px 14px;
      border: 1px solid var(--gold);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
    }

    .button:hover {
      background: var(--gold);
      color: var(--dark);
    }

    main {
      padding: 38px 0 55px;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0;
      font-size: clamp(28px, 5vw, 40px);
    }

    .intro {
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .leaderboard-card {
      background: linear-gradient(145deg, #102319, #080d0a);
      border: 1px solid var(--gold);
      border-radius: 14px;
      overflow: hidden;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 16px 18px;
      border-bottom: 1px solid #c9a64b30;
    }

    th {
      color: var(--gold);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #ffffff08;
    }

    .rank {
      color: var(--gold);
      font-weight: bold;
      width: 70px;
    }

    .points {
      color: var(--gold);
      font-weight: bold;
      text-align: right;
    }

    th:last-child {
      text-align: right;
    }

    .status {
      padding: 22px;
      color: var(--muted);
      text-align: center;
    }

    footer {
      border-top: 1px solid #c9a64b40;
      color: var(--muted);
      text-align: center;
      padding: 22px 12px;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      th, td {
        padding: 13px 10px;
        font-size: 13px;
      }

      .brand {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <a class="brand" href="index.html">♞ DYCHESS</a>
      <a class="button" href="index.html">Back to Home</a>
    </div>
  </header>

  <main class="container">
    <div class="eyebrow">SEASON 0</div>
    <h1>TOP PLAYERS</h1>
    <p class="intro">
     Ranked by total points earned (1st place = 3 points · 2nd place = 2 points · 3rd place = 1 point.)
    </p>

    <section class="leaderboard-card" aria-label="DYCHESS leaderboard">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Player</th>
              <th class="points">DYCHESS Points</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody">
            <tr>
              <td colspan="3" class="status">Loading leaderboard...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    © 2026 DYCHESS. Built for the community.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const dychessDB = window.supabase.createClient(
      'https://rpfowuqlhboslhmvjelc.supabase.co',
      'sb_publishable_K5Fzinv7_Ac0gpaQc2C6Lg_3KstrDKY'
    );

    async function loadLeaderboard() {
      const body = document.getElementById('leaderboardBody');

      try {
        const { data, error } = await dychessDB
          .from('players')
          .select('display_name, lichess_username, dychess_points')
          .gt('dychess_points', 0)
          .order('dychess_points', { ascending: false, nullsFirst: false })
          .order('display_name', { ascending: true });

        if (error) throw error;

        if (!data || data.length === 0) {
          body.innerHTML =
            '<tr><td colspan="3" class="status">No leaderboard players found yet.</td></tr>';
          return;
        }

        body.replaceChildren();

        data.forEach((player, index) => {
          const row = document.createElement('tr');

          const rankCell = document.createElement('td');
          rankCell.className = 'rank';
          rankCell.textContent = index + 1;

        const playerCell = document.createElement('td');

const playerName = document.createElement('a');
playerName.textContent =
  player.display_name ||
  player.lichess_username ||
  'Unknown Player';

playerName.href =
  'player-profile.html?username=' +
  encodeURIComponent(player.lichess_username || player.display_name || '');

playerName.style.color = '#d9b45b';
playerName.style.textDecoration = 'none';

playerCell.appendChild(playerName);

          const pointsCell = document.createElement('td');
          pointsCell.className = 'points';
          pointsCell.textContent = player.dychess_points ?? 0;

          row.append(rankCell, playerCell, pointsCell);
          body.appendChild(row);
        });
      } catch (error) {
        console.error('Could not load DYCHESS leaderboard:', error);
        body.innerHTML =
          '<tr><td colspan="3" class="status">Leaderboard could not load. Please try again later.</td></tr>';
      }
    }

    loadLeaderboard();
  </script>
</body>
</html>
