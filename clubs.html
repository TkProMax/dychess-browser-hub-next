
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07140e">
  <title>Clubs Directory | DYCHESS</title>

  <style>
    :root {
      --bg: #07140e;
      --panel: #10251a;
      --gold: #d9b45b;
      --green: #7fae3d;
      --text: #f5f5ef;
      --muted: #b7c1b8;
      --border: rgba(217,180,91,.3);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(ellipse at top, #1a3422, transparent 55%), var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      gap: 15px;
    }

    .brand {
      color: var(--gold);
      font-size: 23px;
      font-weight: 900;
      letter-spacing: 2px;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover { color: var(--gold); }

    main {
      max-width: 1150px;
      margin: auto;
      padding: 40px 20px 70px;
    }

    .hero {
      text-align: center;
      padding: 45px 20px;
      background: linear-gradient(145deg, #10251a, #0a170f);
      border: 1px solid var(--border);
      border-radius: 18px;
      margin-bottom: 35px;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 49px);
      margin: 13px 0;
    }

    .hero p {
      color: var(--muted);
      line-height: 1.7;
      max-width: 650px;
      margin: auto;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .button {
      display: inline-block;
      padding: 12px 19px;
      border-radius: 8px;
      background: var(--green);
      color: #07140e;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    .button.secondary {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
    }

    .directory-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
    }

    h2 {
      color: var(--gold);
      font-size: 23px;
      margin: 0;
    }

    #clubCount {
      color: var(--muted);
      font-size: 13px;
    }

    .clubs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .club-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 23px;
      display: flex;
      flex-direction: column;
      min-height: 275px;
    }

    .club-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 15px;
    }

    .club-logo {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      object-fit: contain;
      background: #07140e;
      flex-shrink: 0;
    }

    .club-placeholder {
      width: 65px;
      height: 65px;
      display: grid;
      place-items: center;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font-size: 34px;
      flex-shrink: 0;
    }

    .club-card h3 {
      margin: 0;
      font-size: 19px;
      line-height: 1.4;
    }

    .club-location {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .club-description {
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
      margin: 5px 0 20px;
      flex: 1;
    }

    .club-card .button {
      text-align: center;
      margin-top: auto;
    }

    .message {
      padding: 25px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      line-height: 1.7;
      background: var(--panel);
    }

    .error {
      color: #ffd0d0;
      border-color: #854747;
    }

    footer {
      padding: 25px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media(max-width: 600px) {
      header {
        padding: 17px 20px;
        align-items: flex-start;
        flex-direction: column;
      }

      main { padding-top: 25px; }
      .directory-heading { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>

<body>

<header>
  <a class="brand" href="index.html">DYCHESS</a>

  <nav>
    <a href="index.html">Home</a>
    <a href="club-organizer.html">Organizer Dashboard</a>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="eyebrow"></div>
    <h1>Discover Chess Clubs</h1>
    <p>
     
    </p>

    <div class="actions">
     <a class="button" href="player-login.html?next=clubs.html">Join a Club</a>
      <a class="button secondary" href="club-organizer.html">Register as Organizer</a>
    </div>
  </section>

  <section>
    <div class="directory-heading">
      <h2>Explore Clubs</h2>
      <span id="clubCount">Loading clubs...</span>
    </div>

    <div id="clubsList" class="message">
      Loading the DYCHESS club directory...
    </div>
  </section>
</main>

<footer>
  © DYCHESS. Building a stronger chess community.
</footer>

<script>
const SUPABASE_URL = "https://rpfowuqlhboslhmvjelc.supabase.co";
const SUPABASE_KEY = "sb_publishable_K5Fzinv7_Ac0gpaQc2C6Lg_3KstrDKY";

const clubsList = document.getElementById("clubsList");
const clubCount = document.getElementById("clubCount");

async function loadClubs() {
  try {
    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/clubs?select=id,name,slug,description,logo_url,country,city,status" +
      "&status=eq.active&order=created_at.desc",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      const error = await response.json().catch(() => ({}));
      throw new Error(error.message || "Unable to retrieve clubs.");
    }

    const clubs = await response.json();

    clubCount.textContent =
      clubs.length + (clubs.length === 1 ? " club" : " clubs");

    clubsList.replaceChildren();
    clubsList.className = "clubs-grid";

    if (!clubs.length) {
      clubsList.className = "message";
      clubsList.textContent =
        "No active clubs have been registered yet. Be the first to create a DYCHESS club!";
      return;
    }

    clubs.forEach(club => {
      const card = document.createElement("article");
      card.className = "club-card";

      const top = document.createElement("div");
      top.className = "club-top";

      if (club.logo_url) {
        const logo = document.createElement("img");
        logo.className = "club-logo";
        logo.src = club.logo_url;
        logo.alt = club.name + " logo";
        logo.onerror = () => {
          const placeholder = document.createElement("div");
          placeholder.className = "club-placeholder";
          placeholder.textContent = "♞";
          logo.replaceWith(placeholder);
        };
        top.appendChild(logo);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "club-placeholder";
        placeholder.textContent = "♞";
        top.appendChild(placeholder);
      }

      const titleBox = document.createElement("div");

      const title = document.createElement("h3");
      title.textContent = club.name;

      const location = document.createElement("div");
      location.className = "club-location";
      location.textContent =
        [club.city, club.country].filter(Boolean).join(", ") ||
        "Location not provided";

      titleBox.append(title, location);
      top.appendChild(titleBox);

      const description = document.createElement("p");
      description.className = "club-description";
      description.textContent =
        club.description || "Welcome to this DYCHESS chess club.";

      const link = document.createElement("a");
      link.className = "button";
      link.href = "club.html?slug=" + encodeURIComponent(club.slug);
      link.textContent = "View Club";

      card.append(top, description, link);
      clubsList.appendChild(card);
    });

  } catch (error) {
    console.error("Club directory:", error);
    clubsList.className = "message error";
    clubsList.textContent =
      "Unable to load clubs right now. Please refresh the page and try again.";
    clubCount.textContent = "Directory unavailable";
  }
}

loadClubs();
</script>

</body>
</html>
