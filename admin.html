
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DYCHESS Admin Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07140e;
      --panel: #10251a;
      --gold: #d9b45b;
      --text: #f4f4ed;
      --muted: #b7c3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }
    .panel {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: var(--panel);
      border: 1px solid #344b38;
      border-radius: 16px;
    }
    .logo { color: var(--gold); font-size: 24px; font-weight: bold; }
    h1 { margin-bottom: 8px; }
    p { color: var(--muted); line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #526354;
      border-radius: 8px;
      background: #07140e;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: var(--gold);
      color: #07140e;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    #status { overflow-wrap: anywhere; }
    a { color: var(--gold); }
  /* Classic DYCHESS homepage styling */
header {
  background: #fff;
  border-bottom: 1px solid #d8dfd7;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 1180px;
  min-height: 74px;
  margin: auto;
  padding: 12px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 22px;
  flex-wrap: wrap;
}

.logo-mark {
  display: inline-grid;
  place-items: center;
  width: 40px;
  height: 40px;
  background: #102319;
  color: #d9b45b;
  border-radius: 10px;
}

.hero {
  background: linear-gradient(135deg, #080d0a, #102319 55%, #1b3524);
  color: #fff;
  padding: 54px 0;
  border-bottom: 1px solid #c9a64b55;
}

.hero .eyebrow {
  color: #d9b45b;
  text-transform: uppercase;
  letter-spacing: 3px;
  font-size: 12px;
  font-weight: 900;
}

.hero h1 {
  font-size: clamp(36px, 5vw, 58px);
  line-height: 1.1;
  margin: 14px 0;
}

.hero p {
  color: #d4dccd;
  max-width: 620px;
  font-size: 18px;
}

.button {
  display: inline-block;
  padding: 12px 20px;
  border-radius: 8px;
  background: #d9b45b;
  color: #101510;
  font-weight: 800;
}

.button.secondary {
  background: transparent;
  color: #fff;
  border: 1px solid #c9a64b;
}

.tournament-area {
  border: 1px solid #294332;
  border-top: 3px solid #d9b45b;
  border-radius: 14px;
  padding: 26px;
  background: #10251a;
  margin: 22px 0 40px;
}

@media (max-width: 600px) {
  .nav {
    align-items: flex-start;
    flex-direction: column;
  }
}
  </style>
</head>
<body>
  <main class="panel">
    <div class="logo">♞ DYCHESS</div>
    <h1>Admin Login</h1>
    <p>Sign in with your authorized DYCHESS administration account.</p>

    <form id="loginForm">
      <label for="email">Admin email</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button id="loginButton" type="submit">Sign In</button>
    </form>
<section id="tournamentDashboard" hidden>
  <hr>
  <h2>Tournament Management</h2>
  <p>Add a tournament for visitors to see on the DYCHESS homepage.</p>

  <form id="tournamentForm">
    <label for="tournamentName">Tournament name</label>
    <input id="tournamentName" type="text" required
           placeholder="e.g. DYCHESS Weekly Arena">

    <label for="lichessUrl">Lichess tournament link</label>
    <input id="lichessUrl" type="url"
           placeholder="https://lichess.org/tournament/..."
           required>

    <label for="tournamentDate">Tournament date</label>
    <input id="tournamentDate" type="date" required>

    <label for="tournamentTime">Start time (Nigeria time)</label>
    <input id="tournamentTime" type="time" required>

    <button id="saveTournamentButton" type="submit">
      Publish Tournament
    </button>
  </form>

  <p id="tournamentStatus" role="status" aria-live="polite"></p>
</section>
    <p id="status" role="status" aria-live="polite"></p>
    <p><a href="index.html">Back to DYCHESS home</a></p>
  </main>

  <script>
    const SUPABASE_URL = 'https://rpfowuqlhboslhmvjelc.supabase.co';

    // Use the same publishable key already configured in index.html.
    // Replace this placeholder with that publishable key.
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_K5Fzinv7_Ac0gpaQc2C6Lg_3KstrDKY';

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById('loginForm');
    const status = document.getElementById('status');
    const button = document.getElementById('loginButton');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = 'Checking your admin access...';

      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const { data, error } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        const { data: permission, error: permissionError } = await db
          .from('admin_users')
          .select('user_id')
          .eq('user_id', data.user.id)
          .maybeSingle();

        if (permissionError) throw permissionError;

        if (!permission) {
          await db.auth.signOut();
          throw new Error('This account is not authorized as a DYCHESS admin.');
        }

        status.textContent = 'Admin access verified! Login is working.';
        document.getElementById('tournamentDashboard').hidden = false;
      } catch (error) {
        status.textContent = error.message || 'Login failed. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
    document.getElementById('tournamentForm').addEventListener('submit', async (event) => {
  event.preventDefault();

  const status = document.getElementById('tournamentStatus');
  const button = document.getElementById('saveTournamentButton');

  button.disabled = true;
  status.textContent = 'Publishing tournament...';

  try {
    const name = document.getElementById('tournamentName').value.trim();
    const lichessUrl = document.getElementById('lichessUrl').value.trim();
    const tournamentDate = document.getElementById('tournamentDate').value;
    const tournamentTime = document.getElementById('tournamentTime').value;

    const parsedUrl = new URL(lichessUrl);

    if (parsedUrl.protocol !== 'https:' ||
        !['lichess.org', 'www.lichess.org'].includes(parsedUrl.hostname)) {
      throw new Error('Enter a valid HTTPS Lichess tournament link.');
    }

    const { data: sessionData } = await db.auth.getSession();

    if (!sessionData.session) {
      throw new Error('Please sign in again before publishing.');
    }

    const { error } = await db
      .from('tournaments')
      .insert({
        name: name,
        lichess_url: lichessUrl,
        tournament_date: tournamentDate,
        tournament_time: tournamentTime
      });

    if (error) throw error;

    status.textContent = 'Tournament published successfully!';
    document.getElementById('tournamentForm').reset();
  } catch (error) {
    status.textContent = error.message || 'Could not publish tournament.';
  } finally {
    button.disabled = false;
  }
});
  </script>
</body>
</html>
