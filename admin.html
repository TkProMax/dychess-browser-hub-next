
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DYCHESS Admin Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07140e;
      --panel: #10251a;
      --gold: #d9b45b;
      --text: #f4f4ed;
      --muted: #b7c3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }
    .panel {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: var(--panel);
      border: 1px solid #344b38;
      border-radius: 16px;
    }
    .logo { color: var(--gold); font-size: 24px; font-weight: bold; }
    h1 { margin-bottom: 8px; }
    p { color: var(--muted); line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #526354;
      border-radius: 8px;
      background: #07140e;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: var(--gold);
      color: #07140e;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    #status { overflow-wrap: anywhere; }
    a { color: var(--gold); }
 
  </style>
</head>
<body>
  <main class="panel">
    <div class="logo">♞ DYCHESS</div>
    <h1>Admin Login</h1>
    <p>Sign in with your authorized DYCHESS administration account.</p>

    <form id="loginForm">
      <label for="email">Admin email</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button id="loginButton" type="submit">Sign In</button>
    </form>
<section id="tournamentDashboard" hidden>
  <hr>
  <h2>Tournament Management</h2>
  <p>Add a tournament for visitors to see on the DYCHESS homepage.</p>

  <form id="tournamentForm">
    <label for="tournamentName">Tournament name</label>
    <input id="tournamentName" type="text" required
           placeholder="e.g. DYCHESS Weekly Arena">

    <label for="lichessUrl">Lichess tournament link</label>
    <input id="lichessUrl" type="url"
           placeholder="https://lichess.org/tournament/..."
           required>

    <label for="tournamentDate">Tournament date</label>
    <input id="tournamentDate" type="date" required>

    <label for="tournamentTime">Start time (Nigeria time)</label>
    <input id="tournamentTime" type="time" required>

    <button id="saveTournamentButton" type="submit">
      Publish Tournament
    </button>
  </form>

  <p id="tournamentStatus" role="status" aria-live="polite"></p>
  
<hr>
<h3>Existing Tournaments</h3>
<div id="existingTournaments">
  <p>Sign in to load tournaments.</p>
</div>
</section>
    <p id="status" role="status" aria-live="polite"></p>
    <p><a href="index.html">Back to DYCHESS home</a></p>
  </main>

  <script>
    const SUPABASE_URL = 'https://rpfowuqlhboslhmvjelc.supabase.co';

    // Use the same publishable key already configured in index.html.
    // Replace this placeholder with that publishable key.
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_K5Fzinv7_Ac0gpaQc2C6Lg_3KstrDKY';

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById('loginForm');
    const status = document.getElementById('status');
    const button = document.getElementById('loginButton');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = 'Checking your admin access...';

      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const { data, error } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        const { data: permission, error: permissionError } = await db
          .from('admin_users')
          .select('user_id')
          .eq('user_id', data.user.id)
          .maybeSingle();

        if (permissionError) throw permissionError;

        if (!permission) {
          await db.auth.signOut();
          throw new Error('This account is not authorized as a DYCHESS admin.');
        }

        status.textContent = 'Admin access verified! Login is working.';
        document.getElementById('tournamentDashboard').hidden = false;
        await loadExistingTournaments();
      } catch (error) {
        status.textContent = error.message || 'Login failed. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
    let editingTournamentId = null;
    document.getElementById('tournamentForm').addEventListener('submit', async (event) => {
  event.preventDefault();

  const status = document.getElementById('tournamentStatus');
  const button = document.getElementById('saveTournamentButton');

  button.disabled = true;
  status.textContent = 'Publishing tournament...';

  try {
    const name = document.getElementById('tournamentName').value.trim();
    const lichessUrl = document.getElementById('lichessUrl').value.trim();
    const tournamentDate = document.getElementById('tournamentDate').value;
    const tournamentTime = document.getElementById('tournamentTime').value;

    const parsedUrl = new URL(lichessUrl);

    if (parsedUrl.protocol !== 'https:' ||
        !['lichess.org', 'www.lichess.org'].includes(parsedUrl.hostname)) {
      throw new Error('Enter a valid HTTPS Lichess tournament link.');
    }

    const { data: sessionData } = await db.auth.getSession();

    if (!sessionData.session) {
      throw new Error('Please sign in again before publishing.');
    }

  let saveQuery;

const tournamentData = {
  name: name,
  lichess_url: lichessUrl,
  tournament_date: tournamentDate,
  tournament_time: tournamentTime
};

if (editingTournamentId !== null) {
  saveQuery = db
    .from('tournaments')
    .update(tournamentData)
    .eq('id', editingTournamentId);
} else {
  saveQuery = db
    .from('tournaments')
    .insert(tournamentData);
}

const { error } = await saveQuery;

if (error) throw error;

  status.textContent = editingTournamentId !== null
  ? 'Tournament updated successfully!'
  : 'Tournament published successfully!';

document.getElementById('tournamentForm').reset();
editingTournamentId = null;
document.getElementById('saveTournamentButton').textContent = 'Publish Tournament';

await loadExistingTournaments();
  } catch (error) {
    status.textContent = error.message || 'Could not publish tournament.';
  } finally {
    button.disabled = false;
  }
});
  async function loadExistingTournaments() {
  const container = document.getElementById('existingTournaments');
  container.textContent = 'Loading tournaments...';

  try {
    const { data: tournaments, error } = await db
      .from('tournaments')
      .select('id, name, lichess_url, tournament_date, tournament_time')
      .order('id', { ascending: false });

    if (error) throw error;

    container.replaceChildren();

    if (!tournaments || tournaments.length === 0) {
      container.textContent = 'No tournaments have been published yet.';
      return;
    }

    tournaments.forEach((tournament) => {
      const item = document.createElement('div');
      item.style.padding = '12px';
      item.style.marginBottom = '10px';
      item.style.border = '1px solid #38523b';
      item.style.borderRadius = '10px';

      const title = document.createElement('strong');
      title.textContent = tournament.name;

      const details = document.createElement('p');
      details.textContent =
        `${tournament.tournament_date || 'Date not set'} · ` +
        `${tournament.tournament_time || 'Time not set'}`;

      const link = document.createElement('a');
      link.href = tournament.lichess_url;
      link.textContent = 'Open Lichess tournament';
      link.target = '_blank';
      link.rel = 'noopener noreferrer';

      const editButton = document.createElement('button');
      editButton.type = 'button';
      editButton.textContent = 'Edit';
      editButton.style.marginLeft = '10px';

      editButton.addEventListener('click', () => {
        editingTournamentId = tournament.id;
document.getElementById('saveTournamentButton').textContent = 'Save Changes';
        
        document.getElementById('tournamentName').value = tournament.name || '';
        document.getElementById('lichessUrl').value = tournament.lichess_url || '';
        document.getElementById('tournamentDate').value = tournament.tournament_date || '';
        document.getElementById('tournamentTime').value = tournament.tournament_time || '';

        document.getElementById('tournamentStatus').textContent =
          `Tournament selected for editing. ID: ${tournament.id}.`;
        document.getElementById('tournamentName').focus();
      });

      item.append(title, details, link, editButton);
      container.appendChild(item);
    });
  } catch (error) {
    container.textContent =
      error.message || 'Could not load existing tournaments.';
  }
}
  </script>
</body>
</html>
