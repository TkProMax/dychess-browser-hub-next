<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DYCHESS Player Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background: #07140e;
      color: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 35px auto;
    }

    .brand {
      color: #d9b45b;
      font-weight: bold;
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 28px;
    }

    .profile-card {
      background: #10251a;
      border: 1px solid #36543c;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
    }

    .avatar {
      width: 86px;
      height: 86px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #1b3927;
      border: 2px solid #d9b45b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d9b45b;
      font-size: 32px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 10px;
      overflow-wrap: anywhere;
    }

    .username {
      color: #b9c9bc;
      margin-bottom: 28px;
    }

  .points-box {
  display: inline-block;
  min-width: 120px;
  background: #07140e;
  border: 1px solid #6e592a;
  border-radius: 8px;
  padding: 6px 12px;
  margin-top: 8px;
}

    .points-label {
      color: #b9c9bc;
      font-size: 14px;
    }

    .points {
  color: #d9b45b;
  font-size: 26px;
  font-weight: bold;
  margin-top: 4px;
}

    .status {
      color: #b9c9bc;
      text-align: center;
      line-height: 1.6;
    }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: #d9b45b;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">DYCHESS</div>

    <section class="profile-card">
    <div class="avatar" id="avatar">D</div> 

      <div id="avatarSection" style="margin: 0 auto 18px; text-align: center;">
  <img
    id="playerAvatar"
    src="https://placehold.co/120x120/10251a/d9b45b?text=DYCHESS"
    alt="Player profile picture"
    style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid #d9b45b;"
  >
</div>

      <div id="avatarControls" style="display: none; margin: 0 auto 20px; text-align: center;">
  <input
    type="file"
    id="avatarFileInput"
    accept="image/jpeg,image/png,image/webp"
    style="display: none;"
  >

  <button
    type="button"
    id="uploadAvatarButton"
    style="background: #d9b45b; color: #07140e; padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; margin: 4px;"
  >Upload / Change Picture</button>

  <button
    type="button"
    id="removeAvatarButton"
    style="background: transparent; color: #d9b45b; padding: 8px 14px; border: 1px solid #6e592a; border-radius: 6px; cursor: pointer; margin: 4px;"
  >Remove Picture</button>

  <p id="avatarStatus" role="status" style="font-size: 13px;"></p>
</div>
      <h1 id="playerName">Loading profile...</h1>
      <div class="username" id="playerUsername"></div>
      <div id="playerBio" style="margin: 16px 0 24px; color: #b9c9bc; line-height: 1.6; overflow-wrap: anywhere;">
  No bio added yet.
</div>
    <div id="bioEditor" style="display: none; margin-top: 24px; text-align: left;">
  <label for="bioInput" style="display: block; color: #d9b45b; margin-bottom: 10px;">
    Edit Your Bio
  </label>

  <textarea
    id="bioInput"
    maxlength="300"
    rows="4"
    placeholder="Tell the DYCHESS community a little about yourself..."
    style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #36543c; background: #07140e; color: #f4f4f4; font: inherit; resize: vertical;"
  ></textarea>

  <p id="bioCounter" style="color: #b9c9bc; font-size: 13px;">
    0/300 characters
  </p>

  <button
    id="saveBioButton"
    type="button"
    style="background: #d9b45b; color: #07140e; border: none; border-radius: 8px; padding: 12px 18px; font-weight: bold; cursor: pointer;"
  >
    Save Bio
  </button>

  <p id="bioEditStatus" role="status" style="color: #b9c9bc;"></p>
</div>

<p id="bioSignIn" style="display: none; margin-top: 20px;">
  <a
    id="bioSignInLink"
    href="player-login.html"
    style="color: #d9b45b;"
  >Sign in with Lichess to edit your bio</a>
</p>

      <div class="points-box">
        <div class="points-label">DYCHESS POINTS</div>
        <div class="points" id="playerPoints">—</div>
      </div>

      <p class="status" id="profileStatus" aria-live="polite">
        Loading player information...
      </p>
    </section>

    <div style="text-align:center">
      <a class="back-link" href="leaderboard.html">
        ← Back to Leaderboard
      </a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const dychessDB = window.supabase.createClient(
      'https://rpfowuqlhboslhmvjelc.supabase.co',
      'sb_publishable_K5Fzinv7_Ac0gpaQc2C6Lg_3KstrDKY'
    );

  async function loadPlayerProfile() {
  const params = new URLSearchParams(window.location.search);
  const username = params.get('username');
  const status = document.getElementById('profileStatus');
  const editor = document.getElementById('bioEditor');
  const signIn = document.getElementById('bioSignIn');
  const bioInput = document.getElementById('bioInput');
  const bioCounter = document.getElementById('bioCounter');
  const saveButton = document.getElementById('saveBioButton');
  const editStatus = document.getElementById('bioEditStatus');

  editor.style.display = 'none';
  signIn.style.display = 'none';

  if (!username) {
    document.getElementById('playerName').textContent = 'Profile not found';
    status.textContent =
      'No player username was provided. Open a profile from the leaderboard.';
    return;
  }

  try {
    const { data, error } = await dychessDB
      .from('players')
      .select('id, display_name, lichess_username, dychess_points, bio, avatar_path');
    if (error) throw error;

    const player = (data || []).find(item =>
      (item.lichess_username &&
        item.lichess_username.toLowerCase() === username.toLowerCase()) ||
      (item.display_name &&
        item.display_name.toLowerCase() === username.toLowerCase())
    );

    if (!player) {
      document.getElementById('playerName').textContent = 'Profile not found';
      document.getElementById('playerPoints').textContent = '—';
      status.textContent = 'This player could not be found.';
      return;
    }

    const displayName =
      player.display_name || player.lichess_username || 'DYCHESS Player';

    document.getElementById('playerName').textContent = displayName;
    const playerAvatar = document.getElementById('playerAvatar');

if (player.avatar_path) {
  playerAvatar.src = dychessDB.storage
    .from('player-avatars')
    .getPublicUrl(player.avatar_path).data.publicUrl;
} else {
  playerAvatar.src =
    'https://placehold.co/120x120/10251a/d9b45b?text=DYCHESS';
}
    document.getElementById('playerUsername').textContent =
      player.lichess_username
        ? 'Lichess: ' + player.lichess_username
        : 'Lichess username not available';

    const savedBio = player.bio?.trim() || '';
    document.getElementById('playerBio').textContent =
      savedBio || 'No bio added yet.';

    document.getElementById('avatar').textContent =
      displayName.charAt(0).toUpperCase();

    document.getElementById('playerPoints').textContent =
      player.dychess_points ?? 0;

    status.textContent = 'DYCHESS player profile';

    const token = localStorage.getItem('dychess_player_session');
    const expiry = localStorage.getItem('dychess_player_session_expiry');

    if (!token || !expiry || new Date(expiry).getTime() <= Date.now()) {
      signIn.style.display = 'block';
      document.getElementById('bioSignInLink').href =
        'player-login.html?next=' +
        encodeURIComponent(window.location.pathname + window.location.search);
      return;
    }

    const validationResponse = await fetch(
      'https://rpfowuqlhboslhmvjelc.supabase.co/functions/v1/validate-lichess-player-session',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': dychessDB.supabaseKey,
          'x-dychess-session': token
        },
        body: JSON.stringify({})
      }
    );

    const validation = await validationResponse.json();

    if (!validationResponse.ok || !validation.valid) {
      signIn.style.display = 'block';
      document.getElementById('bioSignInLink').href =
        'player-login.html?next=' +
        encodeURIComponent(window.location.pathname + window.location.search);
      return;
    }

    // Only the verified owner of this database record can edit its bio.
    if (String(validation.player.id) !== String(player.id)) {
      return;
    }

    editor.style.display = 'block';
    document.getElementById('avatarControls').style.display = 'block';
    const avatarFileInput = document.getElementById('avatarFileInput');
const uploadAvatarButton = document.getElementById('uploadAvatarButton');
const avatarStatus = document.getElementById('avatarStatus');

uploadAvatarButton.onclick = () => {
  avatarFileInput.click();
};

avatarFileInput.onchange = async () => {
  const file = avatarFileInput.files[0];
  if (!file) return;

  if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
    avatarStatus.textContent = 'Please choose a JPG, PNG, or WebP image.';
    avatarFileInput.value = '';
    return;
  }

  if (file.size > 2 * 1024 * 1024) {
    avatarStatus.textContent = 'The picture must be 2 MB or smaller.';
    avatarFileInput.value = '';
    return;
  }

  uploadAvatarButton.disabled = true;
  avatarStatus.textContent = 'Uploading picture...';

  try {
    const formData = new FormData();
    formData.append('action', 'upload');
    formData.append('file', file);

    const response = await fetch(
      'https://rpfowuqlhboslhmvjelc.supabase.co/functions/v1/manage-player-avatar',
      {
        method: 'POST',
        headers: {
          'apikey': dychessDB.supabaseKey,
          'x-dychess-session': token
        },
        body: formData
      }
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || 'Could not upload picture.');
    }

    const avatarPath = result.avatar_path || result.avatarPath;

    if (avatarPath) {
      playerAvatar.src = dychessDB.storage
        .from('player-avatars')
        .getPublicUrl(avatarPath).data.publicUrl;
    }

    avatarStatus.textContent = 'Profile picture updated successfully!';
    avatarFileInput.value = '';
  } catch (error) {
    console.error('Avatar upload failed:', error);
    avatarStatus.textContent = error.message || 'Upload failed. Please try again.';
  } finally {
    uploadAvatarButton.disabled = false;
  }
};
    document.getElementById('removeAvatarButton').onclick = async () => {
  const removeButton = document.getElementById('removeAvatarButton');
  const avatarStatus = document.getElementById('avatarStatus');

  removeButton.disabled = true;
  avatarStatus.textContent = 'Removing picture...';

  try {
    const response = await fetch(
      'https://rpfowuqlhboslhmvjelc.supabase.co/functions/v1/manage-player-avatar',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': dychessDB.supabaseKey,
          'x-dychess-session': token
        },
        body: JSON.stringify({ action: 'remove' })
      }
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || 'Could not remove picture.');
    }

    playerAvatar.src =
      'https://placehold.co/120x120/10251a/d9b45b?text=DYCHESS';

    avatarStatus.textContent = 'Profile picture removed successfully!';
  } catch (error) {
    console.error('Avatar removal failed:', error);
    avatarStatus.textContent =
      error.message || 'Could not remove picture. Please try again.';
  } finally {
    removeButton.disabled = false;
  }
};
    bioInput.value = savedBio;
    bioCounter.textContent = bioInput.value.length + '/300 characters';

    bioInput.oninput = () => {
      bioCounter.textContent = bioInput.value.length + '/300 characters';
    };

    saveButton.onclick = async () => {
      saveButton.disabled = true;
      editStatus.textContent = 'Saving bio...';

      try {
        const response = await fetch(
          'https://rpfowuqlhboslhmvjelc.supabase.co/functions/v1/update-player-bio',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': dychessDB.supabaseKey,
              'x-dychess-session': token
            },
            body: JSON.stringify({ bio: bioInput.value })
          }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.error || 'Could not save your bio.');
        }

        document.getElementById('playerBio').textContent =
          result.bio || 'No bio added yet.';

        bioInput.value = result.bio || '';
        bioCounter.textContent = bioInput.value.length + '/300 characters';
        editStatus.textContent = 'Bio saved successfully!';
      } catch (error) {
        console.error('Bio save failed:', error);
        editStatus.textContent =
          error.message || 'Could not save your bio. Please try again.';
      } finally {
        saveButton.disabled = false;
      }
    };
  } catch (error) {
    console.error('Could not load player profile:', error);
    document.getElementById('playerName').textContent =
      'Unable to load profile';
    status.textContent = 'Please try again later.';
  }
}

    loadPlayerProfile();
  </script>
</body>
</html>
