
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07140e">
  <title>Team Profile | DYCHESS</title>

  <style>
    :root {
      --bg: #07140e;
      --panel: #10251a;
      --gold: #d9b45b;
      --green: #7fae3d;
      --text: #f2f4ed;
      --muted: #aab7aa;
      --border: rgba(217,180,91,.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 50px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    a {
      color: var(--gold);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 25px;
    }

    .brand {
      color: var(--gold);
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 20px;
    }

    .back {
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 8px;
    }

    .hero, .section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .hero { text-align: center; }

    .logo {
      width: 115px;
      height: 115px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--gold);
      margin-bottom: 12px;
      background: rgba(0,0,0,.25);
    }

    .logo-placeholder {
      width: 115px;
      height: 115px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: rgba(0,0,0,.25);
      color: var(--gold);
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 {
      color: var(--gold);
      margin: 8px 0;
      font-size: 30px;
    }

    h2 {
      color: var(--gold);
      font-size: 19px;
      margin-top: 0;
    }

    .muted {
      color: var(--muted);
      line-height: 1.6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 24px;
    }

    .stat {
      background: rgba(0,0,0,.2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 17px 8px;
    }

    .stat strong {
      display: block;
      color: var(--gold);
      font-size: 24px;
      margin-bottom: 5px;
    }

    .captain-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(0,0,0,.2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    .captain-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(217,180,91,.12);
      color: var(--gold);
      font-size: 23px;
      flex-shrink: 0;
    }

    .captain-card strong {
      display: block;
      margin-bottom: 5px;
    }

    .member {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .member:last-child { border-bottom: 0; }

    .member strong {
      display: block;
      margin-bottom: 4px;
    }

    .captain-tag {
      color: var(--gold);
      font-size: 12px;
      white-space: nowrap;
    }

    .empty {
      color: var(--muted);
      padding: 12px 0;
    }

    .error {
      text-align: center;
      color: #ffb0a8;
      padding: 35px 15px;
    }

    .loading {
      text-align: center;
      color: var(--gold);
      padding: 45px 10px;
    }

    .club-link {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    @media (max-width: 550px) {
      .stats { grid-template-columns: 1fr; }
      .hero, .section { padding: 18px; }
      h1 { font-size: 25px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="top">
      <div class="brand">DYCHESS</div>
      <a class="back" id="backLink" href="clubs.html">← Clubs</a>
    </div>

    <div id="content" class="loading">
      Loading team profile...
    </div>
  </main>

 
<script>
  const SUPABASE_URL =
    "https://rpfowuqlhboslhmvjelc.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_K5Fzinv7_Ac0gpaQc2C6Lg_3KstrDKY";

  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY
  };

  const content = document.getElementById("content");

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    })[character]);
  }

  function safeImageUrl(value) {
    if (!value) return "";

    try {
      const url = new URL(value);

      if (url.protocol === "https:" || url.protocol === "http:") {
        return url.href;
      }
    } catch (_) {}

    return "";
  }

  async function getRows(table, query) {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/${table}?${query}`,
      { headers }
    );

    if (!response.ok) {
      throw new Error(`Could not load ${table}.`);
    }

    return response.json();
  }

  // Authenticated calls to the club-teams Edge Function.
  async function callTeamFunction(payload) {
    const session = localStorage.getItem("dychess_player_session");

    if (!session) {
      throw new Error("PLAYER_NOT_SIGNED_IN");
    }

    const response = await fetch(
      `${SUPABASE_URL}/functions/v1/club-teams`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "x-dychess-session": session
        },
        body: JSON.stringify(payload)
      }
    );

    const result = await response.json();

    if (!response.ok || result.success === false) {
      throw new Error(
        result.error ||
        result.message ||
        "TEAM_REQUEST_FAILED"
      );
    }

    return result;
  }

  function showError(title, message) {
    content.innerHTML = `
      <div class="error">
        <h2>${escapeHTML(title)}</h2>
        <p>${escapeHTML(message)}</p>
        <a href="clubs.html">Return to Clubs</a>
      </div>`;
  }

  async function loadTeam() {
    const params = new URLSearchParams(window.location.search);
    const teamId = params.get("id");

    if (!teamId) {
      showError(
        "No team was specified",
        "Please return to the club page and select a team."
      );
      return;
    }

    try {
      const teams = await getRows(
        "club_teams",
        `select=id,club_id,name,description,logo_url,status,captain_player_id,created_at&id=eq.${encodeURIComponent(teamId)}&status=eq.active&limit=1`
      );

      if (!teams.length) {
        showError(
          "Team not found",
          "This team may not exist or may no longer be active."
        );
        return;
      }

      const team = teams[0];

      const clubs = await getRows(
        "clubs",
        `select=id,name,slug,status&id=eq.${encodeURIComponent(team.club_id)}&status=eq.active&limit=1`
      );

      if (!clubs.length) {
        showError(
          "Club unavailable",
          "The club associated with this team is not currently available."
        );
        return;
      }

      const club = clubs[0];

      document.getElementById("backLink").href =
        `club.html?slug=${encodeURIComponent(club.slug)}`;

      document.getElementById("backLink").textContent =
        "← " + club.name;

      await renderTeam(team, club);

    } catch (error) {
      console.error(error);

      showError(
        "Unable to load team",
        error.message || "Please try again later."
      );
    }
  }

  async function renderTeam(team, club) {
    const memberships = await getRows(
      "club_team_memberships",
      `select=player_id,status,reviewed_at&team_id=eq.${encodeURIComponent(team.id)}&status=eq.active`
    );

    const playerIds = [
      ...new Set([
        ...memberships.map(member => Number(member.player_id)),
        ...(team.captain_player_id
          ? [Number(team.captain_player_id)]
          : [])
      ])
    ];

    let players = [];

    if (playerIds.length) {
      players = await getRows(
        "players",
        `select=id,display_name,lichess_username&id=in.(${playerIds.join(",")})`
      );
    }

    const playerMap = new Map(
      players.map(player => [String(player.id), player])
    );

    const captain = team.captain_player_id
      ? playerMap.get(String(team.captain_player_id))
      : null;

    const captainName = captain
      ? (captain.display_name || captain.lichess_username)
      : "Not yet appointed";

    const logoUrl = safeImageUrl(team.logo_url);

    const createdDate = team.created_at
      ? new Date(team.created_at).toLocaleDateString()
      : "Not available";

    const memberList = memberships
      .map(member => {
        const player = playerMap.get(String(member.player_id));

        return {
          id: member.player_id,
          name: player
            ? (player.display_name || player.lichess_username)
            : `Player ${member.player_id}`,
          isCaptain:
            String(member.player_id) ===
            String(team.captain_player_id)
        };
      })
      .sort((a, b) => {
        if (a.isCaptain && !b.isCaptain) return -1;
        if (!a.isCaptain && b.isCaptain) return 1;
        return a.name.localeCompare(b.name);
      });

    content.innerHTML = `
      <section class="hero">
        ${logoUrl
          ? `<img class="logo" src="${escapeHTML(logoUrl)}" alt="Team logo">`
          : `<div class="logo-placeholder">♟</div>`}

        <h1>${escapeHTML(team.name)}</h1>

        <p class="muted">
          A team of ${escapeHTML(club.name)}
        </p>

        <p class="muted">
          ${escapeHTML(team.description || "Welcome to this team.")}
        </p>

        <a class="club-link"
           href="club.html?slug=${encodeURIComponent(club.slug)}">
          View Club Profile
        </a>

        <div class="stats">
          <div class="stat">
            <strong>${memberships.length}</strong>
            Active Members
          </div>

          <div class="stat">
            <strong>${team.captain_player_id ? "1" : "0"}</strong>
            Team Captain
          </div>

          <div class="stat">
            <strong>${escapeHTML(createdDate)}</strong>
            Team Created
          </div>
        </div>
      </section>

      <section class="section">
        <h2>Team Captain</h2>

        <div class="captain-card">
          <div class="captain-icon">♛</div>
          <div>
            <strong>${escapeHTML(captainName)}</strong>
            <span class="muted">
              ${captain ? "Team Captain" : "No captain has been appointed yet"}
            </span>
          </div>
        </div>
      </section>

      <section class="section">
        <h2>Team Members</h2>

        <div id="teamMembers">
          ${memberList.length
            ? memberList.map(member => `
                <div class="member">
                  <div>
                    <strong>${escapeHTML(member.name)}</strong>
                    <span class="muted"></span>
                  </div>

                  ${member.isCaptain
                    ? `<span class="captain-tag">♛ Captain</span>`
                    : ""}
                </div>
              `).join("")
            : `<p class="empty">This team has no active members yet.</p>`
          }
        </div>
      </section>

      <div id="captainManagement"></div>
    `;

    // Show management controls only to an authorized organizer or captain.
    await loadCaptainManagement(team);
  }


async function loadCaptainManagement(team) {
  const panel = document.getElementById("captainManagement");

  if (!panel) return;

  const session = localStorage.getItem("dychess_player_session");

  if (!session) return;

  try {
    const result = await callTeamFunction({
      action: "list_teams",
      clubId: team.club_id
    });

    const authorizedTeam = (result.teams || []).find(
      item => String(item.id) === String(team.id)
    );

    if (!authorizedTeam) return;

    const requests = Array.isArray(authorizedTeam.requests)
      ? authorizedTeam.requests
      : [];

    const members = Array.isArray(authorizedTeam.members)
      ? authorizedTeam.members
      : [];

    const memberHTML = members.length
      ? members.map(member => {
          const player = member.player || {};

          const playerName =
            player.display_name ||
            player.lichess_username ||
            ("Player " + member.player_id);

          const isCaptain =
            Number(team.captain_player_id) ===
            Number(member.player_id);

          return `
            <div class="member" style="
              display:flex;
              flex-wrap:wrap;
              align-items:center;
              justify-content:space-between;
              gap:12px;
              padding:14px 0;
              border-bottom:1px solid rgba(255,255,255,.1);
            ">
              <div>
                <strong>${escapeHTML(playerName)}</strong>
                ${isCaptain
                  ? `<span class="captain-tag">♛ Captain</span>`
                  : ""}
              </div>

              ${!isCaptain ? `
                <button
                  type="button"
                  class="danger"
                  data-remove-member="${escapeHTML(member.id)}"
                  style="cursor:pointer;padding:9px 14px;">
                  Remove Member
                </button>
              ` : ""}
            </div>
          `;
        }).join("")
      : `<p class="empty">No approved team members yet.</p>`;

    const requestHTML = requests.length
      ? requests.map(request => {
          const player = request.player || {};

          const playerName =
            player.display_name ||
            player.lichess_username ||
            ("Player " + request.player_id);

          return `
            <div class="member" style="
              display:flex;
              flex-wrap:wrap;
              align-items:center;
              justify-content:space-between;
              gap:12px;
              padding:14px 0;
              border-bottom:1px solid rgba(255,255,255,.1);
            ">
              <div>
                <strong>${escapeHTML(playerName)}</strong>
                <p class="muted">Team join request</p>
              </div>

              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button
                  type="button"
                  data-team-review="approve"
                  data-request-id="${escapeHTML(request.id)}">
                  Approve
                </button>

                <button
                  type="button"
                  class="danger"
                  data-team-review="reject"
                  data-request-id="${escapeHTML(request.id)}">
                  Reject
                </button>
              </div>
            </div>
          `;
        }).join("")
      : `<p class="empty">There are no pending requests for this team.</p>`;

    panel.innerHTML = `
      <section class="section">
        <h2>Team Management</h2>

        <p class="muted">
          Manage members and review requests for this team.
        </p>

        <h3>Approved Team Members (${members.length})</h3>

        <div id="managedTeamMembers">
          ${memberHTML}
        </div>

        <h3>Pending Join Requests (${requests.length})</h3>

        <div id="teamRequestList">
          ${requestHTML}
        </div>

        <p id="teamManagementMessage"
           class="muted"
           aria-live="polite"></p>
      </section>
    `;

  } catch (error) {
    if (
      error.message !== "CAPTAIN_ACCESS_REQUIRED" &&
      error.message !== "PLAYER_NOT_SIGNED_IN"
    ) {
      console.error("Team management:", error);
    }
  }
}


  // Handle captain approval and rejection actions.
  content.addEventListener("click", async event => {
    const button = event.target.closest("[data-team-review]");

    if (!button) return;

    const decision = button.dataset.teamReview;
    const requestId = button.dataset.requestId;

    if (!requestId || !["approve", "reject"].includes(decision)) {
      return;
    }

    const message = document.getElementById("teamManagementMessage");

    button.disabled = true;
    button.textContent = "Please wait...";

    if (message) {
      message.textContent = "Processing request...";
    }

    try {
      const result = await callTeamFunction({
        action: "review_request",
        requestId,
        decision
      });

      alert(
        result.message ||
        (decision === "approve"
          ? "Player has joined the team."
          : "Team join request rejected.")
      );

      await loadTeam();

    } catch (error) {
      console.error(error);

      if (message) {
        message.textContent =
          error.message || "Unable to process this request.";
      }

      button.disabled = false;
      button.textContent =
        decision === "approve" ? "Approve" : "Reject";
    }
  });

  loadTeam();
</script>

</body>
</html>
